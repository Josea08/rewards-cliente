<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#f59e0b">
<title>Rewards — Tarjeta de fidelidad</title>
<link rel="icon" href="icons/icon.png">
<style>
*{box-sizing:border-box}
[hidden]{display:none !important}
:root{
  --space-xs:6px;--space-sm:10px;--space-md:16px;--space-lg:22px;--space-xl:28px;
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;
  --touch:48px;
  --shadow:0 1px 3px rgb(0 0 0 / 0.08),0 1px 2px rgb(0 0 0 / 0.06);
  --shadow-md:0 4px 6px -1px rgb(0 0 0 / 0.1),0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.1),0 4px 6px -4px rgb(0 0 0 / 0.1);
  --bg:#f8fafc;--surface:#ffffff;--surface-alt:#f1f5f9;
  --ink:#0f172a;--ink-soft:#475569;--muted:#64748b;
  --line:#e2e8f0;--line-strong:#cbd5e1;
  --primary:#1e40af;--primary-dark:#1e3a8a;--primary-soft:#dbeafe;--primary-ink:#1e3a8a;
  --success:#059669;--success-soft:#d1fae5;--success-ink:#064e3b;
  --danger:#dc2626;--danger-soft:#fee2e2;--danger-ink:#991b1b;
  --warning:#d97706;--warning-soft:#fef3c7;--warning-ink:#78350f;
}
body.theme-dark{
  --bg:#0f172a;--surface:#1e293b;--surface-alt:#334155;
  --ink:#f8fafc;--ink-soft:#cbd5e1;--muted:#94a3b8;
  --line:#334155;--line-strong:#475569;
  --primary:#3b82f6;--primary-dark:#2563eb;--primary-soft:#1e3a8a;--primary-ink:#bfdbfe;
  --success:#34d399;--success-soft:#064e3b;--success-ink:#a7f3d0;
  --danger:#f87171;--danger-soft:#450a0a;--danger-ink:#fecaca;
  --warning:#fbbf24;--warning-soft:#451a03;--warning-ink:#fef3c7;
  --shadow:0 1px 3px rgb(0 0 0 / 0.5),0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-md:0 4px 6px -1px rgb(0 0 0 / 0.4),0 2px 4px -2px rgb(0 0 0 / 0.4);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.5),0 4px 6px -4px rgb(0 0 0 / 0.5);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden;transition:background .3s ease,color .3s ease}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;padding-top:calc(44px + env(safe-area-inset-top));box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{margin:0;font-size:1.25rem;font-weight:800;color:var(--ink);letter-spacing:.1px;display:flex;align-items:center;gap:10px}
.brand-img{width:32px;height:32px;object-fit:contain;flex-shrink:0}
.theme-toggle{background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius-md);width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.theme-toggle:active{transform:scale(.96)}
.theme-toggle svg{width:22px;height:22px}
header .sub{margin:6px 0 0;color:var(--muted);font-size:.88rem;display:block}
main{max-width:480px;margin:0 auto;padding:16px}
section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-lg);margin-bottom:20px;box-shadow:var(--shadow)}
h2{margin-top:0;font-size:1.15rem;font-weight:800}
.hint{color:var(--muted);font-size:.88rem}
.msg{font-weight:700;font-size:.9rem;min-height:1.25em}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.row.wrap{flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius-md);font-size:1rem;margin-top:4px;background:var(--surface);color:var(--ink);min-height:var(--touch)}
input[type=text]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgb(30 64 175 / .12)}
button{border:0;border-radius:var(--radius-md);padding:12px 18px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;min-height:var(--touch);transition:transform .06s ease,filter .15s ease}
button:active{transform:scale(.97)}
button:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.3)}
.primary{background:linear-gradient(180deg,var(--primary-dark),var(--primary));color:#fff;box-shadow:0 4px 10px rgb(30 64 175 / .25)}
.primary:not(:disabled):hover{filter:brightness(1.05)}
.secondary{background:var(--surface-alt);color:var(--ink);border:1px solid var(--line)}
.secondary:not(:disabled):hover{background:var(--line-strong)}
.danger{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger);margin-top:14px}
.danger:not(:disabled):hover{background:var(--danger-soft)}
.small{padding:10px 16px;font-size:.92rem;min-height:44px;min-width:44px}
.list{list-style:none;padding:0;margin:var(--space-md) 0 0}
.list li{border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:var(--space-sm);background:var(--surface);cursor:pointer}
.list li:hover{border-color:var(--primary);box-shadow:0 4px 12px rgb(30 64 175 / .1)}
.list li strong{display:block}
.list li span{color:var(--muted);font-size:.92rem}
.list li.group-head{border:0;background:transparent;cursor:default;font-weight:800;padding:14px 4px 2px;color:var(--ink);display:flex;align-items:center;gap:8px}
.list li.group-head:hover{border-color:transparent;box-shadow:none}
.bank-card{border-radius:var(--radius-xl);padding:14px 18px 16px;color:#fff;margin-bottom:var(--space-lg);box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;gap:10px}
.bank-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.bank-card-brand{font-size:.8rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.94}
.bank-card-chip{width:48px;height:36px;border-radius:10px;background:linear-gradient(135deg,#fde68a,#d97706);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);position:relative;flex-shrink:0}
.bank-card-chip::before,.bank-card-chip::after{content:"";position:absolute;background:rgba(0,0,0,.22)}
.bank-card-chip::before{left:0;right:0;top:50%;height:1px}
.bank-card-chip::after{top:0;bottom:0;left:50%;width:1px}
.bank-card-number{margin:0 0 4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.4rem;letter-spacing:2px;text-shadow:0 1px 2px rgba(0,0,0,.3);text-align:left}
.bank-card-foot{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:12px}
.bank-card-holder{margin-bottom:0;text-align:left;flex:1;min-width:0}
.bank-card-label{display:block;font-size:.68rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;margin-bottom:2px}
.bank-card-holder h2{color:#fff;margin:2px 0 0;font-size:1.2rem}
.bank-card-qr{background:#fff;border-radius:8px;padding:6px;display:flex;justify-content:center;flex-shrink:0;width:auto;max-width:none;margin:0}
.bank-card-qr svg{width:96px;height:auto;display:block}
.progress{font-size:1.1rem;font-weight:800;margin:4px 0 12px;color:var(--ink-soft);text-align:center}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 16px}
.slot{border:2px solid var(--line);border-radius:var(--radius-md);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;position:relative;background:var(--surface)}
.slot .num{font-size:1.3rem}
.slot .lbl{font-size:.62rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.slot.stamped{border-color:var(--danger);background:var(--danger-soft);color:var(--danger-ink)}
.slot.stamped::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2rem;opacity:.85}
.slot.milestone{border-style:dashed}
.slot.milestone .lbl{color:var(--danger-ink)}
.reward{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px}
.reward p{margin:0}
.reward .goal-icon{vertical-align:-3px;margin-right:6px}
.badge{display:inline-block;background:var(--primary-soft);color:var(--primary-ink);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:800}
.badge.done{background:var(--success-soft);color:var(--success-ink)}
footer{text-align:center;color:var(--muted);padding:0 16px 24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));font-size:.9rem}
video{width:100%;border-radius:12px;margin-top:10px;background:#000}
.error{text-align:center;color:var(--muted);padding:40px 16px}
.btn-icon,.goal-icon,.icon-store{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-icon svg,.goal-icon svg{width:18px;height:18px}
.icon-store svg{width:18px;height:18px;color:var(--muted)}
#closeDetail{margin-bottom:var(--space-md)}
@media(max-width:480px){.slots{grid-template-columns:repeat(5,1fr);gap:6px}.slot .lbl{font-size:.55rem;letter-spacing:0}.row{flex-wrap:wrap}header{padding-top:calc(44px + env(safe-area-inset-top))}}

</style>
</head>
<body>
<header>
  <div class="header-row">
    <h1><img src="icons/icon.png" class="brand-img" alt="Rewards"> Rewards</h1>
    <button id="themeToggle" class="theme-toggle" aria-label="Cambiar modo claro/oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8.5 8.5 0 1 1 10.5 4 6.8 6.8 0 0 0 20 13.5z"/></svg></button>
  </div>
  <span class="sub">Tarjeta de fidelidad</span>
  <span class="sub"><span class="icon-store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9 6 4h12l1.5 5"/><path d="M4.5 9h15V20h-15z"/><path d="M10 20v-5.5h4V20"/><path d="M4.5 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0"/></svg></span> <span id="businessName"></span></span>
</header>
<main id="app" hidden>
  <div id="card" class="bank-card">
    <div class="bank-card-head">
      <span class="bank-card-brand">Tarjeta de fidelidad</span>
      <span class="bank-card-chip" aria-hidden="true"></span>
    </div>
    <p class="bank-card-number"><strong id="code"></strong></p>
    <div class="bank-card-foot">
      <div class="bank-card-holder">
        <span class="bank-card-label">Titular</span>
        <h2 id="name"></h2>
      </div>
      <div class="bank-card-qr"><div id="cardQr"></div></div>
    </div>
  </div>
  <p class="progress" id="progress"></p>
  <div class="slots" id="slots"></div>
  <div class="reward"><p><span class="goal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="9.5" rx="1.5"/><path d="M12 10.5V20M4 14.5h16"/><path d="M12 10.5c-4.5 0-5.5-2-4-3.7C9.5 5 12 7.2 12 10.5zm0 0c4.5 0 5.5-2 4-3.7C14.5 5 12 7.2 12 10.5z"/></svg></span> <strong>Compra 5:</strong> <span id="discount"></span></p><span class="badge" id="discountState"></span></div>
  <div class="reward"><p><span class="goal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5.5a4 4 0 0 1-8 0z"/><path d="M8 5.5H5.5a3 3 0 0 0 3.2 3.7M16 5.5h2.5a3 3 0 0 1-3.2 3.7"/><path d="M12 13.5V17M8.5 20.5h7M10 17h4"/></svg></span> <strong>Compra 10:</strong> <span id="prize"></span></p><span class="badge" id="prizeState"></span></div>
  <p class="hint">Presenta esta tarjeta en cada compra. El código QR lo escanea el negocio para sellar tu compra.</p>
</main>
<p class="error" id="error" hidden>No se pudo cargar la tarjeta. Pide un nuevo link en el negocio.</p>
<footer>© J'R Dev 2026</footer>
<script src="qrcode.min.js"></script>
<script>
var GRADIENTS = [['#7f1d1d','#dc2626'],['#1e3a8a','#3b82f6'],['#14532d','#22c55e'],['#581c87','#a855f7'],['#7c2d12','#f97316'],['#713f12','#eab308'],['#134e4a','#14b8a6'],['#831843','#ec4899']];
function decodeData(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}
function importPayload(d) {
  // Sin teléfono: el QR solo lleva lo necesario para crear la tarjeta.
  return JSON.stringify({ v: 1, n: d.n, c: d.c, d: d.d, p: d.p, b: d.b || '', th: d.t ?? 0 });
}
(function () {
  // El link puede venir con ?c= (App Link https que se manda por WhatsApp)
  // o con #c= (link viejo de la página). Se aceptan los dos.
  var m = (location.search || '').match(/[?&]c=([A-Za-z0-9\-_]+)/) || (location.hash || '').match(/#c=([A-Za-z0-9\-_]+)/);
  if (!m) { document.getElementById('error').hidden = false; return; }
  var d;
  try { d = decodeData(m[1]); } catch (e) { document.getElementById('error').hidden = false; return; }
  if (!d || d.v !== 1 || !d.c || !d.n) { document.getElementById('error').hidden = false; return; }
  var g = GRADIENTS[d.t || 0] || GRADIENTS[0];
  // La foto es el fondo de la tarjeta (no un logo), igual que en el local:
  // si el link trajo la miniatura, cubre la tarjeta con el mismo velo oscuro.
  if (d.im) {
    document.getElementById('card').style.background = 'linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url(' + d.im + ') center/cover';
  } else {
    document.getElementById('card').style.background = 'linear-gradient(135deg,' + g[0] + ',' + g[1] + ')';
  }
  document.getElementById('businessName').textContent = d.b || '';
  document.getElementById('code').textContent = d.c;
  document.getElementById('name').textContent = d.n;
  document.getElementById('progress').textContent = (d.s || 0) + ' de 10 compras';
  var slots = document.getElementById('slots');
  for (var n = 1; n <= 10; n++) {
    var div = document.createElement('div');
    div.className = 'slot' + (n <= (d.s || 0) ? ' stamped' : '') + ((n === 5 || n === 10) ? ' milestone' : '');
    div.innerHTML = '<span class="num">' + n + '</span><span class="lbl">' + (n === 5 ? 'Descuento' : n === 10 ? 'Premio' : 'Compra') + '</span>';
    slots.appendChild(div);
  }
  document.getElementById('discount').textContent = d.d || '';
  document.getElementById('prize').textContent = d.p || '';
  var ds = document.getElementById('discountState'), ps = document.getElementById('prizeState');
  ds.textContent = d.dc ? 'Entregado ✓' : ((d.s || 0) >= 5 ? '¡Desbloqueado!' : 'Pendiente');
  ds.className = 'badge' + (d.dc ? ' done' : '');
  ps.textContent = d.pc ? 'Entregado ✓' : ((d.s || 0) >= 10 ? '¡Desbloqueado!' : 'Pendiente');
  ps.className = 'badge' + (d.pc ? ' done' : '');
  if (typeof qrcode !== 'undefined') {
    var qr = qrcode(0, 'M');
    qr.addData(importPayload(d));
    qr.make();
    document.getElementById('cardQr').innerHTML = qr.createSvgTag({ cellSize: 2, margin: 4, scalable: true });
  }
  document.getElementById('app').hidden = false;
})();
</script>

<script>
// Toggle claro/oscuro (igual que la app del negocio): guardado en localStorage.
(function(){
  var KEY='rewardsThemeV1';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8.5 8.5 0 1 1 10.5 4 6.8 6.8 0 0 0 20 13.5z"/></svg>';
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.5 12h2M17.5 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>';
  var btn=document.getElementById('themeToggle');
  function apply(){var dark=localStorage.getItem(KEY)==='dark';document.body.classList.toggle('theme-dark',dark);if(btn)btn.innerHTML=dark?SUN:MOON;}
  if(btn)btn.addEventListener('click',function(){var next=document.body.classList.contains('theme-dark')?'light':'dark';localStorage.setItem(KEY,next);apply();});
  apply();
})();
</script>

</body>
</html>
